[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-predictor"
version = "0.1.0"
description = "AI-powered Supply Chain Disruption Predictor using NLP, Machine Learning, and Industrial Engineering analytics."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "streamlit>=1.36,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.4,<2.0",
    "plotly>=5.22,<6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9.0", "ruff>=0.5,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
