# Streamlit configuration for the Supply Chain Disruption Predictor web app.
# Controls theme colors, server behavior, and browser settings.

[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
font = "sans serif"
